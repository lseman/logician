<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 960 300"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Logician logo</title>
  <desc id="desc">A stylized lowercase L integrated with a logarithmic graph, followed by the word Logician.</desc>

  <defs>
    <linearGradient id="logCurve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2F81F7"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>

    <style>
      .ink { fill: #0D1117; }
      .axis { stroke: #57606A; }
      .wordmark { fill: #0D1117; }
      @media (prefers-color-scheme: dark) {
        .ink { fill: #F0F6FC; }
        .axis { stroke: #8C959F; }
        .wordmark { fill: #F0F6FC; }
      }
    </style>
  </defs>

  <!-- Log / L mark -->
  <g transform="translate(42 28)">
    <!-- subtle coordinate axes -->
    <path class="axis"
          d="M30 218 V28 M30 218 H278"
          fill="none"
          stroke-width="5"
          stroke-linecap="round"/>

    <!-- axis arrowheads -->
    <path class="axis"
          d="M22 40 L30 28 L38 40 M266 210 L278 218 L266 226"
          fill="none"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- sparse ticks -->
    <g class="axis" stroke-width="4" stroke-linecap="round">
      <path d="M24 164 H36"/>
      <path d="M24 110 H36"/>
      <path d="M24 56 H36"/>
      <path d="M92 212 V224"/>
      <path d="M154 212 V224"/>
      <path d="M216 212 V224"/>
    </g>

    <!-- bold L -->
    <path class="ink"
          d="M66 42
             C66 32 74 24 84 24
             H104
             V174
             C104 188 112 196 126 196
             H236
             C246 196 254 204 254 214
             V220
             H116
             C86 220 66 201 66 172
             Z"/>

    <!-- logarithmic curve -->
    <path d="M70 238
             C76 206 88 180 104 160
             C129 129 162 109 198 97
             C225 88 251 83 282 80"
          fill="none"
          stroke="url(#logCurve)"
          stroke-width="10"
          stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="365" y="190"
        class="wordmark"
        font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="104"
        font-weight="650"
        letter-spacing="-4">logician</text>
</svg>
