<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <title>Logician Banner</title>
  <!-- Icon badge (left side) -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="140" height="140" rx="32" fill="url(#badgeGradient)"/>
    <rect x="0" y="0" width="140" height="140" rx="32" fill="url(#badgeSheen)"/>

    <!-- Geometric L monogram, top-right corner cut at 45deg, node accent at joint -->
    <path d="M 46 32
             L 66 32
             L 66 88
             L 96 88
             L 108 100
             L 96 112
             L 46 112
             Z"
          fill="#0b0e11"/>

    <!-- circuit node accent at the L's inner joint -->
    <circle cx="66" cy="88" r="7" fill="#0b0e11"/>
    <circle cx="66" cy="88" r="4" fill="#67e8f9"/>
  </g>

  <!-- Text content -->
  <g transform="translate(210, 100)">
    <text x="0" y="0" font-size="64" font-weight="bold" font-family="system-ui, sans-serif"
          fill="url(#titleGradient)">Logician</text>
    <text x="0" y="35" font-size="20" font-family="system-ui, sans-serif"
          fill="#22d3ee" font-weight="500">LLM Agent Framework for llama.cpp</text>
    <text x="0" y="60" font-size="14" font-family="system-ui, sans-serif"
          fill="#8a959e">Tools &#8226; RAG &#8226; Execution Traces</text>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="badgeSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="80%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
</svg>
