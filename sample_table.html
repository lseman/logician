<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  table {
    border-collapse: collapse;
    width: 50%;
    margin: 20px 0;
  }
  th, td {
    border: 2px solid #ffffff;
    padding: 10px 16px;
    text-align: left;
  }
  th {
    background-color: #333333;
    color: #ffffff;
  }
  td {
    background-color: #1a1a2e;
    color: #e0e0e0;
  }
  tr:nth-child(even) td {
    background-color: #16213e;
  }
</style>
</head>
<body>

<table>
  <tr>
    <th>Name</th>
    <th>Age</th>
    <th>City</th>
    <th>Occupation</th>
  </tr>
  <tr>
    <td>Alice</td>
    <td>32</td>
    <td>Berlin</td>
    <td>Engineer</td>
  </tr>
  <tr>
    <td>Bob</td>
    <td>27</td>
    <td>Tokyo</td>
    <td>Designer</td>
  </tr>
  <tr>
    <td>Charlie</td>
    <td>45</td>
    <td>São Paulo</td>
    <td>Researcher</td>
  </tr>
  <tr>
    <td>Diana</td>
    <td>38</td>
    <td>Nairobi</td>
    <td>Writer</td>
  </tr>
  <tr>
    <td>Edward</td>
    <td>29</td>
    <td>Sydney</td>
    <td>Developer</td>
  </tr>
</table>

</body>
</html>
