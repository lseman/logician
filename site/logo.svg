<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    width="512"
    height="512"
    viewBox="0 0 1024 1024"
    version="1.1"
    xmlns="http://www.w3.org/2000/svg">
  <title>Logician Logo</title>
  <defs>
    <!-- Dark metal shade gradient -->
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e2a34" />
      <stop offset="25%" stop-color="#2a3d4a" />
      <stop offset="50%" stop-color="#4a6577" />
      <stop offset="75%" stop-color="#2a3d4a" />
      <stop offset="100%" stop-color="#1e2a34" />
    </linearGradient>

    <!-- Bulb glow — cyan to violet -->
    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#06b6d4" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Light cone from lamp -->
    <linearGradient id="lightCone" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <!-- Base metal gradient -->
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a5060" />
      <stop offset="100%" stop-color="#1e2a34" />
    </linearGradient>

    <!-- Filament gradient -->
    <linearGradient id="filament" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Cord -->
  <line x1="512" y1="100" x2="512" y2="230"
        stroke="#3a5060" stroke-width="8" stroke-linecap="round" />

  <!-- Hook cap -->
  <path d="M468 230 Q468 200 512 190 Q556 200 556 230"
        fill="#3a5060" stroke="#5c7a8e" stroke-width="4" />

  <!-- Shade body — conical dome -->
  <path d="M396 230
           Q396 206 512 206
           Q628 206 628 230
           L592 456
           Q592 480 512 480
           Q432 480 432 456 Z"
        fill="url(#shade)"
        stroke="#5c7a8e"
        stroke-width="4"
        stroke-linejoin="round" />

  <!-- Bottom rim -->
  <ellipse cx="512" cy="472" rx="80" ry="16"
           fill="#1a2530"
           stroke="#5c7a8e"
           stroke-width="3" />

  <!-- Light cone emanating from lamp -->
  <path d="M440 476 L300 760 L724 760 L584 476 Z"
        fill="url(#lightCone)"
        opacity="0.4" />

  <!-- Bulb glow -->
  <circle cx="512" cy="352" r="96" fill="url(#bulbGlow)" />

  <!-- Filament core -->
  <circle cx="512" cy="352" r="20"
          fill="none"
          stroke="url(#filament)"
          stroke-width="5"
          opacity="0.9" />
  <circle cx="512" cy="352" r="10"
          fill="#22d3ee"
          opacity="0.8" />
  <circle cx="512" cy="352" r="4"
          fill="#ffffff"
          opacity="0.9" />

  <!-- Light rays -->
  <g stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity="0.25">
    <line x1="512" y1="480" x2="512" y2="520" />
    <line x1="464" y1="480" x2="448" y2="520" />
    <line x1="560" y1="480" x2="576" y2="520" />
    <line x1="424" y1="480" x2="400" y2="520" />
    <line x1="600" y1="480" x2="624" y2="520" />
  </g>

  <!-- Base -->
  <path d="M440 600 L584 600 L608 672 L416 672 Z"
        fill="url(#base)"
        stroke="#5c7a8e"
        stroke-width="4"
        stroke-linejoin="round" />

  <!-- Base top rim -->
  <ellipse cx="512" cy="600" rx="72" ry="14"
           fill="#2a3d4a"
           stroke="#5c7a8e"
           stroke-width="2" />

  <!-- Base bottom -->
  <ellipse cx="512" cy="672" rx="96" ry="18"
           fill="#1e2a34"
           stroke="#5c7a8e"
           stroke-width="3" />

  <!-- Base detail line -->
  <line x1="440" y1="636" x2="584" y2="636"
        stroke="#5c7a8e"
        stroke-width="2"
        opacity="0.4" />

  <!-- Brand name -->
  <text x="512" y="800"
        font-family="'Plus Jakarta Sans', Arial, sans-serif"
        font-size="100"
        font-weight="800"
        letter-spacing="24"
        text-anchor="middle"
        fill="#eef7fb"
        opacity="0.55">logician</text>
</svg>
