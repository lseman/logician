name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
          - runner: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install pinned Rust toolchain
        run: rustup show
      - run: bun install --frozen-lockfile
      - name: Build native addon and executable
        run: make -C packages/log-tui binary
      - name: Test native capabilities
        run: bun test packages/log-natives/smoke.test.ts
      - name: Package and verify isolated installation
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bun packages/log-tui/scripts/package-release.ts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/log-tui/dist/logician-*.tar.gz
            packages/log-tui/dist/logician-*.tar.gz.sha256
          draft: false
          generate_release_notes: true
