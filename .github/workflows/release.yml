name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install deps (project root)
        run: bun install --frozen-lockfile

      - name: Build binary
        working-directory: tui
        run: |
          bun build --target=bun --compile packages/tui/src/index.ts --outfile dist/logician

      - name: Create archive
        working-directory: tui
        run: |
          mkdir -p release
          cp dist/logician release/
          tar -czf logician-linux-x86_64.tar.gz -C release logician

      - name: Generate checksum
        working-directory: tui
        run: |
          sha256sum logician-linux-x86_64.tar.gz > logician-linux-x86_64.tar.gz.sha256

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tui/logician-linux-x86_64.tar.gz
            tui/logician-linux-x86_64.tar.gz.sha256
          draft: false
          generate_release_notes: true

  build-darwin-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install deps (project root)
        run: bun install --frozen-lockfile

      - name: Build binary
        working-directory: tui
        run: |
          bun build --target=bun --compile packages/tui/src/index.ts --outfile dist/logician

      - name: Create archive
        working-directory: tui
        run: |
          mkdir -p release
          cp dist/logician release/
          tar -czf logician-darwin-arm64.tar.gz -C release logician

      - name: Generate checksum
        working-directory: tui
        run: |
          sha256sum logician-darwin-arm64.tar.gz > logician-darwin-arm64.tar.gz.sha256

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tui/logician-darwin-arm64.tar.gz
            tui/logician-darwin-arm64.tar.gz.sha256
          draft: false
          generate_release_notes: true
