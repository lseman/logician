name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install pinned Rust toolchain
        run: rustup show
      - run: bun install --frozen-lockfile
      - run: bun run --filter @logician/log-natives build
      - run: cargo test --locked --workspace
      - run: bun test packages/log-natives/smoke.test.ts
      - run: bun run ci
      - run: bun run eval:smoke
