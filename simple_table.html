<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Table</title>
  <style>
    body { font-family: sans-serif; margin: 40px; background: #f5f5f5; }
    table { border-collapse: collapse; width: 60%; margin: 0 auto; background: white; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    th, td { padding: 12px 20px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #4a90d9; color: white; }
    tr:hover { background: #f0f4ff; }
    h2 { text-align: center; color: #333; }
  </style>
</head>
<body>
  <h2>Simple Table</h2>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Role</th>
        <th>City</th>
        <th>Rating</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Alice</td>
        <td>Engineer</td>
        <td>San Francisco</td>
        <td>⭐ 4.8</td>
      </tr>
      <tr>
        <td>Bob</td>
        <td>Designer</td>
        <td>New York</td>
        <td>⭐ 4.5</td>
      </tr>
      <tr>
        <td>Charlie</td>
        <td>Manager</td>
        <td>London</td>
        <td>⭐ 4.9</td>
      </tr>
      <tr>
        <td>Diana</td>
        <td>Analyst</td>
        <td>Tokyo</td>
        <td>⭐ 4.7</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
