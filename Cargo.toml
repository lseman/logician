[workspace]
resolver = "3"
members = [
	"crates/pi-ast",
	"crates/pi-diff",
	"crates/pi-edit",
	"crates/pi-natives",
	"crates/snapcompact",
	"crates/pi-walker",
	"crates/pi-minimize",
]
exclude = ["ecosystem/graphician/graphician-native"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
mismatched_lifetime_syntaxes = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }
allow_attributes_without_reason = "warn"
borrow_as_ptr = "allow"
cast_ptr_alignment = "allow"
ptr_as_ptr = "allow"
ref_as_ptr = "allow"
undocumented_unsafe_blocks = "warn"
unsafe_derive_deserialize = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
tuple_array_conversions = "allow"
float_cmp = "allow"
inline_always = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
redundant_closure_for_method_calls = "allow"
return_self_not_must_use = "allow"
inconsistent_struct_constructor = "allow"
missing_fields_in_debug = "allow"
struct_excessive_bools = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
option_if_let_else = "allow"
enum_glob_use = "allow"
items_after_statements = "allow"
wildcard_imports = "allow"
redundant_pub_crate = "allow"
let_underscore_untyped = "allow"
similar_names = "allow"
unreadable_literal = "allow"
verbose_bit_mask = "allow"
default_trait_access = "allow"
significant_drop_tightening = "allow"
assert_is_empty = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"

[workspace.dependencies]
# ── Internal (this workspace's own crates) ──────────────────────────────────
pi-ast = { path = "crates/pi-ast" }
pi-diff = { path = "crates/pi-diff" }
pi-natives = { path = "crates/pi-natives" }
pi-edit = { path = "crates/pi-edit" }
snapcompact = { path = "crates/snapcompact" }
pi-walker = { path = "crates/pi-walker" }
pi-minimize = { path = "crates/pi-minimize" }

# ── Shared third-party deps ──────────────────────────────────────────────────
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.23"
brush-parser = "0.3"
dashmap = "6.1"
fancy-regex = "0.16"
flume = "0.11"
fontdue = { version = "0.9", default-features = false }
globset = "0.4"
heapless = "0.9"
ignore = "0.4"
inferno = { version = "0.12", default-features = false }
libc = "0.2"
png = "0.18"
napi = { version = "3", features = ["napi10", "tokio_rt", "tokio_time"] }
napi-build = "2"
napi-derive = "3"
parking_lot = "0.12.5"
phf = { version = "0.13", features = ["macros"] }
rayon = "1.12"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
smallvec = { version = "1.15.1", features = ["serde", "write", "union", "const_new"] }
thiserror = "2"
tiktoken-rs = "0.11"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
grep-matcher = "0.1"
grep-pcre2 = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
xutf = "1.4"
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh32"] }
zstd = "0.13"
windows-sys = { version = "0.61", features = [
	"Wdk_Storage_FileSystem",
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Storage_FileSystem",
	"Win32_System_IO",
] }

# ── AST & Tree-Sitter (pi-ast) ───────────────────────────────────────────────
ast-grep-core = { version = "0.39", default-features = false, features = ["tree-sitter"] }
tree-sitter = "0.25"
tree-sitter-astro = { version = "0.1.1", package = "tree-sitter-astro-next" }
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-clojure = "0.1"
tree-sitter-cmake = "0.7.1"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-dart = "0.2"
tree-sitter-diff = "0.1"
tree-sitter-dockerfile = { version = "0.2.0", package = "tree-sitter-dockerfile-updated" }
tree-sitter-elixir = "0.3"
tree-sitter-elisp = "1.6.1"
tree-sitter-erlang = "0.16.0"
tree-sitter-fortran = "0.6.0"
tree-sitter-go = "0.25"
tree-sitter-graphql = "0.1.0"
tree-sitter-haskell = "0.23"
tree-sitter-hcl = "1.1"
tree-sitter-html = "0.23"
tree-sitter-ini = "1.4.0"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-julia = "0.23"
tree-sitter-just = "0.2.0"
tree-sitter-kotlin = { version = "0.4", package = "tree-sitter-kotlin-sg" }
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1"
tree-sitter-md = "0.5"
tree-sitter-nix = "0.3"
tree-sitter-objc = "3.0"
tree-sitter-ocaml = "0.24.2"
tree-sitter-odin = "1.3"
tree-sitter-php = "0.24"
tree-sitter-powershell = "0.26.4"
tree-sitter-proto = "0.4.0"
tree-sitter-python = "0.25"
tree-sitter-r = "1.2.0"
tree-sitter-regex = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-solidity = "1.2"
tree-sitter-sql = { version = "0.3.11", package = "tree-sitter-sequel" }
tree-sitter-starlark = "1.3"
tree-sitter-svelte = { version = "0.1.1", package = "tree-sitter-svelte-next" }
tree-sitter-swift = "0.7"
tree-sitter-tlaplus = "1.5"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-verilog = "1.0"
tree-sitter-vue = { version = "0.1.0", package = "tree-sitter-vue-next" }
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-zig = "1.1"
